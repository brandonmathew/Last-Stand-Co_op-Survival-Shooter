name: Build Android - Last Stand
on:
  workflow_dispatch: {}

jobs:
  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Free disk BEFORE pulling the ~7 GB compressed / ~20 GB extracted image.
      # ubuntu-latest starts with only ~14 GB free; Android images fail with
      # "no space left on device" without this.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Library cache — without this every run re-imports all assets.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v6
        env:
          # GameCI online Personal activation — first option to try.
          # No UNITY_LICENSE file for a new Personal licence.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}  # legacy .ulf only, leave unset
        with:
          targetPlatform: Android
          unityVersion: 6000.3.5f2
          buildName: LastStand
          androidAppBundle: false  # false = installable .apk smoke test; true = .aab for Play Store
          # Release signing — add later, after the smoke test works.
          # Requires Custom Keystore enabled in Android Player Settings.
          # androidKeystoreName: user.keystore
          # androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          # androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android
